<style>
:root{--bg:#040916;--c:rgba(14,24,52,.74);--l:rgba(120,160,255,.17);--t:#eaf0ff;--m:#8fa0c8;--a:#ffb23e;--b:#3d9bff;--r:#ff5a5f;--g:#34d6a4;--p:#9b7cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--t);font:clamp(14px,.4vw + 13px,16.5px)/1.5 "SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none;-webkit-text-size-adjust:100%}
.st{position:fixed;left:0;top:0;width:1px;height:1px;border-radius:50%;pointer-events:none;z-index:0;animation:tw 5s ease-in-out infinite alternate}.st.b{animation-duration:8s;animation-delay:-3s}
.me{position:fixed;top:-5vh;left:70vw;width:2px;height:90px;background:rgba(190,205,255,.35);transform:rotate(35deg);opacity:0;pointer-events:none;z-index:0;animation:mt 17s linear infinite 4s}
@keyframes tw{from{opacity:.25}to{opacity:1}}@keyframes mt{0%{opacity:0;transform:translate(0,0) rotate(35deg)}3%{opacity:.9}12%{opacity:0;transform:translate(-45vw,60vh) rotate(35deg)}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{position:relative;z-index:1;max-width:min(580px,100%);margin:0 auto;padding:14px 14px 28px}.g{display:grid;gap:2px}.logo{display:block;margin:0 auto}
h1,h2,h3{margin:.3em 0;letter-spacing:.04em}
.card{position:relative;background:var(--c);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--l);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card::before,.card::after{content:"";position:absolute;width:11px;height:11px;border:2px solid rgba(255,178,62,.6);pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.ent .card{animation:rise .38s ease}.big{font-size:1.22em;font-weight:800;letter-spacing:.01em}.mu{color:var(--m);font-size:.86em}
.lb{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--m);font-weight:700}
button{font:inherit;font-weight:700;letter-spacing:.01em;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;min-height:46px;background:#2f86e8;color:#fff;width:100%;margin:5px 0;cursor:pointer;box-shadow:none;transition:transform .08s,filter .15s,box-shadow .15s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.975)}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.s{background:rgba(46,66,128,.6);box-shadow:none;border-color:var(--l)}
button.a{background:#f5a623;color:#241500;border-color:rgba(255,255,255,.3);box-shadow:none}
button.r{background:#e5484d;box-shadow:none}
button.sel:not(.opt){outline:2px solid var(--a);outline-offset:2px;box-shadow:0 0 0 5px rgba(255,178,62,.16)}button.sel:not(.opt)::before{content:"";width:1em;height:1em;background:currentColor;-webkit-mask:var(--mk-check) center/contain no-repeat;mask:var(--mk-check) center/contain no-repeat}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:grayscale(.45)}
input{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--l);background:rgba(6,12,32,.8);color:var(--t);margin:5px 0 12px}input::placeholder{color:#5f719b}
.row{display:flex;gap:10px}.row>*{flex:1}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}.hud>div{display:flex;flex-direction:column;min-width:0}.hud b{font-size:1.18em;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hc{text-align:center;align-items:center}.hr{align-items:flex-end}
.ring{position:relative;width:60px;height:60px;flex:none}.ring svg{width:60px;height:60px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4.5}.ring .bg{stroke:rgba(143,160,200,.2)}.ring .fg{stroke:var(--g);stroke-linecap:round;stroke-dasharray:150.8;transition:stroke-dashoffset .3s linear,stroke .3s}
.tm{position:absolute;inset:0;display:grid;place-items:center;font:700 14.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--t)}
.steps{display:flex;gap:3px;margin:2px 0 10px}.steps i{flex:1;height:3px;border-radius:2px;background:rgba(143,160,200,.2)}.steps i.d{background:rgba(255,178,62,.5)}.steps i.n{background:var(--a);box-shadow:none;height:4px;margin-top:-.5px}
.gauge{margin:4px 0 6px}.gh{display:flex;justify-content:space-between;align-items:baseline}.gh b{font:700 13px ui-monospace,Menlo,Consolas,monospace}.bar{display:flex;gap:4px;margin:6px 0 2px}.bar i{flex:1;height:11px;border-radius:4px;background:rgba(143,160,200,.14);border:1px solid rgba(143,160,200,.12)}
.bar i.on{border-color:transparent}.bar i.on.z0{background:var(--g);box-shadow:none}.bar i.on.z1{background:var(--a);box-shadow:none}.bar i.on.z2{background:var(--r);box-shadow:none}.bar.warn i.on{animation:pulse 1.1s infinite}
.pl{display:inline-flex;align-items:center;gap:6px;margin:3px 3px 3px 0;padding:4px 11px 4px 4px;border-radius:99px;background:rgba(62,84,150,.35);border:1px solid var(--l);font-size:.88em}.pl .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.pl.d{opacity:.42;text-decoration:line-through}.pl.k{border-color:var(--a)}.pl.c{border-color:rgba(61,155,255,.8);box-shadow:none}
.ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px dotted #fff6;flex:none}.rc{display:flex;gap:14px;align-items:center}

function sceneSvg(id,seed){const rn=rng('st'+seed);let st='';for(let i=0;i<46;i++)st+=`<circle cx="${(rn()*200).toFixed(1)}" cy="${(rn()*140).toFixed(1)}" r="${(.4+rn()*1.1).toFixed(2)}" fill="#fff" opacity="${(.3+rn()*.7).toFixed(2)}"/>`;return `<svg viewBox="0 0 200 140" role="img" aria-label="Immagine da riconoscere"><rect width="200" height="140" fill="#08142f"/>${st}${SC[id][1]()}</svg>`}
const ROLEX={ingegnere:['Giorno: premi il pulsante prima che finisca il voto Riparazione/Controllo.','Si somma al bonus della Chiave; non si consuma se quel giorno si indaga.'],medico:['Fase Risposte, solo dopo un sabotaggio con danno 2 o più.','Il Blackout lo blocca nel round dopo.'],meccanico:['Fase Risposte, quando vuoi.','Il Blackout lo blocca nel round dopo.'],pilota:['Fase di preparazione, prima che i sabotatori vedano le opzioni.','Non puoi togliere un sabotaggio già incompiuto. La scelta resta segreta.'],analista:['Nei round in cui si vota Controllo.','Non su un giocatore già controllato. Può essere ingannato da Hacker, Infiltrato e Indiziato.'],ispettore:['Nei round di Controllo, dal round 2.','Il verdetto è pubblico e scritto dal sito. Non lo inganna l\'Hacker né l\'Indiziato, ma sì la maschera dell\'Infiltrato.'],difesa:['Fase Risposte, subito dopo un sabotaggio completato.','Annulla l\'effetto secondario, mai il danno.'],ufficiale:['Discussione o Giorno.','Se non c\'è un sabotaggio incompiuto l\'abilità non si consuma.'],garante:['Fase di verifica dopo il voto di espulsione.','L\'evento è pubblico ma anonimo. Conta come round di Stallo.'],giudice:['Solo in ballottaggio, con i finalisti in parità.','È l\'unico caso in cui si espelle senza maggioranza assoluta.'],controspionaggio:['Discussione o Giorno, dal round 2.','Risponde solo «Agente indipendente» oppure no: non dice se Spia o Sovietico.'],archivista:['Discussione, Giorno o Risposte.','Elenco di chi ha già tenuto la Chiave in questo ciclo.'],informatore:['Discussione o Giorno, dal round 2.','Segnalazione vera: uno dei due nomi è un sabotatore. Stesso formato di quella falsa.'],indiziato:['Passiva: si attiva da sola.','Il primo controllo ordinario ti dà «Sabotatore». L\'Ispettore non viene ingannato.'],medium:['Discussione o Giorno, dal round 2.','Funziona solo su un Relitto.'],custode:['Parti con la Chiave. Il Tracciamento arriva nella fase della Chiave ogni 3 round.','Il Tracciamento rivela il ruolo esatto di chi ha già tenuto la Chiave. Sei un bersaglio per i sabotatori.'],infiltrato:['Passiva: si attiva da sola.','La maschera vale per il primo controllo, anche dell\'Ispettore.'],hacker:['Notte, dal round 2.','Non funziona contro l\'Ispettore. Con l\'Infiltrato prima vale l\'inversione.'],capo:['Notte, prima che finisca la fase.','Conviene quando manca esattamente un punto al costo.'],disturbatore:['Notte, dal round 2.','Non blocca Chiave, voto e discussione. L\'abilità bloccata non si consuma.'],agitatore:['Voto di espulsione, dal round 2.','Il voto conta doppio. L\'abilità si consuma solo se voti qualcuno.'],provocatore:['Discussione o Giorno, dal round 2.','Segnalazione falsa, identica a quella vera.'],corruttore:['Notte, dal round 2.','Se il possessore non è un fedele l\'abilità è sprecata.'],spia:['Quando ricevi la Chiave, passala al Sovietico a fine round.','Se sbagli destinatario la parola segreta diventa pubblica.'],sovietico:['Quando ricevi la Chiave da chi non è la Spia.','La Chiave si blocca; obiettivo in solo: una parola, mai la Spia.']};

 if(v.key===me.id&&v.st==='play'&&v.ph!=='ready'){const t=v.blocked?'La Chiave è <b>bloccata</b>: non si muove più. Sei sull\'obiettivo in solo.':m.role==='spia'?'Devi passarla al <b>Sovietico</b> a fine round: se è lui la Cellula vince. Se sbagli, la parola segreta diventa pubblica.':R[m.role][1]==='s'?'Stanotte il sabotaggio scelto riceve <b>+1 progresso</b>. A fine round devi passarla.':'Se oggi si <b>ripara</b>, la riparazione vale <b>+1</b>. Se si indaga, il bonus va perso. A fine round devi passarla.';

 if(v.ph==='defense'&&m.alive&&m.role==='medico'&&!m.used)x+=pc(''+I('heart-pulse')+' Medico',`<p class="mu">−1 collasso dopo un sabotaggio con danno 2 o più.${v.blk?' '+I('alert')+' Bloccato dal Blackout.':''}</p><button class="a" ${m.can&&!v.blk?'':'disabled'} onclick="send2('med',1)">${I('heart-pulse')} Riduci il collasso di 1${m.can?'':' (serve danno ≥2)'}</button>`);
 if(v.ph==='defense'&&m.alive&&m.role==='meccanico'&&!m.used)x+=pc(''+I('wrench')+' Meccanico',`<p class="mu">−1 collasso, quando vuoi.${v.blk?' '+I('alert')+' Bloccato dal Blackout.':''}</p><button class="a" ${v.blk?'disabled':''} onclick="send2('mec',1)">${I('wrench')} Riduci il collasso di 1</button>`);
 if(v.ph==='veto'&&v.coord===me.id&&m.alive)x+=pc(''+I('user-round')+' Responsabilità di bordo',`<p class="mu">Una volta nel tuo mandato puoi sacrificarti al posto del giocatore designato (non puoi se il designato sei tu).</p><button class="a" onclick="send2('sac',1)">Sacrificati al posto del designato</button>`);
 if(m.notes&&m.notes.length)x+=`<div class="card"><div class="big sm">${I('mail')} Messaggi privati</div><div>${m.notes.map(n=>'<div class="qa" style="font-size:.9em;color:var(--t);padding:3px 0">'+esc(n)+'</div>').join('')}</div></div>`;
 if(m.mission)x+=`<div class="card"><div class="big sm">${I('target')} Obiettivo in solo</div><p>Fai dire a <b>${esc(pn(m.mission.t))}</b> la parola <b>«${esc(m.mission.w)}»</b>, senza che sospetti nulla. Quando pensi che l'abbia detta, premi il pulsante nella fase della Chiave: il sito chiederà conferma a lui in privato.</p><button class="a" ${V.ph==='key'&&!m.claimed?'':'disabled'} onclick="send2('claim',1)">${V.ph!=='key'?'Disponibile nella fase della Chiave':(m.claimed?''+I('ok')+' Dichiarata':'Missione compiuta')}</button></div>`;
 if(m.trace)x+=`<div class="card"><div class="big sm">${I('key-round')} Tracciamento</div><p>Scegli un giocatore che ha già tenuto la Chiave: scoprirai il suo ruolo esatto.</p>${choose(m.trace.map(id=>({id,name:pn(id)})),'tr','')}</div>`;
 if(m.ab){const a=m.ab;x+=`<div class="card"><div class="big sm">${I('sparkles')} Abilità: ${esc(a.l)}</div><div class="mu">Una sola volta per partita.</div>`+(a.t?choose(a.t==='s'?SAB.map(x=>({id:x[0],name:x[1]})):a.t==='f'?(V.fin||[]).map(id=>({id,name:pn(id)})):V.pl.filter(p=>a.t==='d'?!p.a:p.a&&p.id!==me.id&&!((m.role==='analista'||m.role==='ispettore')&&(V.checked||[]).includes(p.id))),'ab',''):`<button class="a" onclick="send2('ab',1)">${I('sparkles')} ${esc(a.l)}</button>`)+'</div>'}return x}

 const o=[id,...d];for(let i=2;i>0;i--){const j=(rn()*(i+1))|0;[o[i],o[j]]=[o[j],o[i]]}const a=(ui.qa||{})[key],s=qScore();
 return `<div class="card"><div class="lb">Osservazione di bordo</div><div class="big sm">Cosa vedi?</div><div class="qimg">${sceneSvg(id,key)}</div>${o.map(x=>`<button class="opt ${a?(x===id?'ok':(x===a?'no':'')):''}" ${a?'aria-disabled="true"':''} onclick="qans('${key}','${x}','${id}')"><span class="rd"></span><span class="tx">${SC[x][0][0].toUpperCase()+SC[x][0].slice(1)}</span></button>`).join('')}<div class="qa">${a?(a===id?''+I('ok')+' Esatto!':''+I('nok')+' Era: '+SC[id][0]):'Un esercizio di osservazione: in questa fase tutti fanno la stessa cosa, così nessuno si tradisce.'} · Serie: ${s.ok}/${s.tot}</div></div>`}
