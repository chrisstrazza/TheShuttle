<style>
:root{--bg:#040916;--c:rgba(14,24,52,.74);--l:rgba(120,160,255,.17);--t:#eaf0ff;--m:#8fa0c8;--a:#ffb23e;--b:#3d9bff;--r:#ff5a5f;--g:#34d6a4;--p:#9b7cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--t);font:clamp(14px,.4vw + 13px,16.5px)/1.5 "SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;background:radial-gradient(900px 620px at 88% -8%,rgba(110,80,255,.24),transparent 60%),radial-gradient(820px 700px at -10% 108%,rgba(30,140,255,.2),transparent 55%),radial-gradient(600px 400px at 50% 50%,rgba(20,40,90,.35),transparent 70%),var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none;-webkit-text-size-adjust:100%}
.st{position:fixed;left:0;top:0;width:1px;height:1px;border-radius:50%;pointer-events:none;z-index:0;animation:tw 5s ease-in-out infinite alternate}.st.b{animation-duration:8s;animation-delay:-3s}
.me{position:fixed;top:-5vh;left:70vw;width:2px;height:90px;background:linear-gradient(#fff0,#fff);transform:rotate(35deg);opacity:0;pointer-events:none;z-index:0;animation:mt 17s linear infinite 4s}
@keyframes tw{from{opacity:.25}to{opacity:1}}@keyframes mt{0%{opacity:0;transform:translate(0,0) rotate(35deg)}3%{opacity:.9}12%{opacity:0;transform:translate(-45vw,60vh) rotate(35deg)}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{position:relative;z-index:1;max-width:min(580px,100%);margin:0 auto;padding:14px 14px 28px}.g{display:grid;gap:2px}.logo{display:block;margin:0 auto}
h1,h2,h3{margin:.3em 0;letter-spacing:.04em}
.card{position:relative;background:var(--c);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--l);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 10px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.05)}
.card::before,.card::after{content:"";position:absolute;width:11px;height:11px;border:2px solid rgba(255,178,62,.6);pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.ent .card{animation:rise .38s ease}.big{font-size:1.22em;font-weight:800;letter-spacing:.01em}.mu{color:var(--m);font-size:.86em}
.lb{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--m);font-weight:700}
button{font:inherit;font-weight:700;letter-spacing:.01em;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;min-height:46px;background:linear-gradient(180deg,#46a6ff,#2377e0);color:#fff;width:100%;margin:5px 0;cursor:pointer;box-shadow:0 4px 14px rgba(35,119,224,.35);transition:transform .08s,filter .15s,box-shadow .15s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.975)}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.s{background:linear-gradient(180deg,rgba(62,84,150,.6),rgba(34,50,100,.6));box-shadow:none;border-color:var(--l)}
button.a{background:linear-gradient(180deg,#ffc867,#f5a623);color:#241500;border-color:rgba(255,255,255,.3);box-shadow:0 4px 18px rgba(255,178,62,.34)}
button.r{background:linear-gradient(180deg,#ff7d81,#e5484d);box-shadow:0 4px 14px rgba(229,72,77,.35)}
button.sel:not(.opt){outline:2px solid var(--a);outline-offset:2px;box-shadow:0 0 0 5px rgba(255,178,62,.16),0 4px 20px rgba(255,178,62,.3)}button.sel:not(.opt)::before{content:'✓ '}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:grayscale(.45)}
input{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--l);background:rgba(6,12,32,.8);color:var(--t);margin:5px 0 12px}input::placeholder{color:#5f719b}
.row{display:flex;gap:10px}.row>*{flex:1}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}.hud>div{display:flex;flex-direction:column;min-width:0}.hud b{font-size:1.18em;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hc{text-align:center;align-items:center}.hr{align-items:flex-end}
.ring{position:relative;width:60px;height:60px;flex:none}.ring svg{width:60px;height:60px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4.5}.ring .bg{stroke:rgba(143,160,200,.2)}.ring .fg{stroke:var(--g);stroke-linecap:round;stroke-dasharray:150.8;transition:stroke-dashoffset .3s linear,stroke .3s}
.tm{position:absolute;inset:0;display:grid;place-items:center;font:700 14.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--t)}
.steps{display:flex;gap:3px;margin:2px 0 10px}.steps i{flex:1;height:3px;border-radius:2px;background:rgba(143,160,200,.2)}.steps i.d{background:rgba(255,178,62,.5)}.steps i.n{background:var(--a);box-shadow:0 0 8px var(--a);height:4px;margin-top:-.5px}
.gauge{margin:4px 0 6px}.gh{display:flex;justify-content:space-between;align-items:baseline}.gh b{font:700 13px ui-monospace,Menlo,Consolas,monospace}.bar{display:flex;gap:4px;margin:6px 0 2px}.bar i{flex:1;height:11px;border-radius:4px;background:rgba(143,160,200,.14);border:1px solid rgba(143,160,200,.12)}

const IMPL=Object.keys(R);const CREW_OPT=['meccanico','pilota','analista','ispettore','difesa','ufficiale','garante','giudice','controspionaggio','archivista','informatore','indiziato','medium'],SAB_ROLES=['infiltrato','hacker','capo','disturbatore','agitatore','provocatore','corruttore'],FIXED=['custode','spia','sovietico','ingegnere','medico'];

const SYN=[['ispettore','infiltrato',3],['analista','hacker',3],['ispettore','hacker',2],['indiziato','provocatore',2],['informatore','provocatore',2],['pilota','ufficiale',3],['garante','agitatore',3],['garante','giudice',2],['difesa','disturbatore',2],['meccanico','disturbatore',2],['medico','disturbatore',1],['archivista','corruttore',3],['controspionaggio','archivista',2],['capo','ufficiale',2],['medium','indiziato',1],['ingegnere','corruttore',1],['indiziato','infiltrato',1],['difesa','capo',1]];
const INFO=['ufficiale','archivista','controspionaggio','informatore','medium'];
function scoreComp(N,sab,crew){const all=new Set([...sab,...crew,...FIXED]);let sc=0;SYN.forEach(([a,b,w])=>{if(all.has(a)&&all.has(b))sc+=w});
 if(crew.includes('ispettore')||crew.includes('analista'))sc+=4;else sc-=6;
 if(crew.includes('ispettore')&&crew.includes('analista'))sc-=1;
 if(sab.includes('capo')||sab.includes('agitatore'))sc+=2;
 if(sab.some(r=>['infiltrato','hacker','provocatore'].includes(r)))sc+=2;else sc-=3;
 if(crew.filter(r=>INFO.includes(r)).length>Math.ceil(crew.length/2))sc-=4;
 if(N<=9)['medium','giudice','archivista'].forEach(r=>{if(crew.includes(r))sc-=2});
 if(N>=12&&(crew.includes('controspionaggio')||crew.includes('garante')))sc+=1;
 if(N<=11&&crew.filter(r=>['controspionaggio','archivista','medium'].includes(r)).length>=2)sc-=3;
 if(crew.some(r=>['garante','giudice'].includes(r))||sab.includes('agitatore'))sc+=1;
 if(N>=10&&crew.some(r=>['archivista','controspionaggio','medium'].includes(r)))sc+=1;
 return sc+Math.random()*1.5}
function autoRoles(N,S){const C=N-S-5,c=[];for(let i=0;i<500;i++){const sab=shuf(SAB_ROLES).slice(0,S),crew=shuf(CREW_OPT).slice(0,C);c.push([scoreComp(N,sab,crew),sab,crew])}c.sort((a,b)=>b[0]-a[0]);const t=c[Math.random()*Math.min(5,c.length)|0];return{sab:t[1],crew:t[2]}}

function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}

function mk(t,on){return new Promise((res,rej)=>{let done=0;const tm=setTimeout(()=>{if(!done){done=1;rej(new Error('timeout'))}},12000);const c=SB.channel(t,{config:{broadcast:{self:false}}});c.on('broadcast',{event:'m'},({payload})=>on(payload)).subscribe(st=>{if(done)return;if(st==='SUBSCRIBED'){done=1;clearTimeout(tm);res(c)}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){done=1;clearTimeout(tm);rej(new Error(st))}})})}

async function join0(code,host,fresh){room=code;isHost=host;ui.dead=0;localStorage.last=code;wl();
 await mk(topic('p-'+me.id),onView);
 if(host){const hc=await mk(topic('h'),hostMsg);
  if(fresh){ui.pong=0;snd(hc,{t:'ping',id:me.id});await new Promise(r=>setTimeout(r,1800));if(ui.pong)return exists(code)}
  localStorage.room=code;localStorage.host='1';if(!fresh&&!G)G=JSON.parse(localStorage.G||'null');if(fresh||!G||G.room!==code)G={room:code,st:'lobby',pl:[],log:[]};
  addP(me.id,me.name,me.tk);save();push();if(G.end&&!G.paused)sched()}
 else{localStorage.room=code;localStorage.host='';up=await mk(topic('h'),()=>{});act({t:'join',name:me.name});
  clearInterval(ui.jiv);ui.jiv=setInterval(()=>{if(!V&&!ui.dead)act({t:'join',name:me.name})},3000);
  clearTimeout(ui.nr);ui.nr=setTimeout(()=>{if(!V&&!ui.dead)noRoom()},6500)}}

function exists(code){card('⚠️ Nave già esistente',`Una nave chiamata «<b>${esc(code)}</b>» è già attiva. Puoi entrare come giocatore oppure scegliere un altro nome.`,`<button class="a" onclick="localStorage.room='${esc(code)}';localStorage.host='';location.reload()">🛰️ Entra nella nave</button><button class="s" onclick="back(1)">↩️ Scegli un altro nome</button>`)}
